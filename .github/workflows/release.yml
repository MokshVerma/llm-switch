name: Build and release

# Every push to main (a direct push, or a merged pull request) rebuilds Windows and macOS and refreshes the
# rolling "latest" pre-release. If the commits since the last release warrant it, a numbered release is also
# published, with its version picked from the Conventional Commit types:
#
#   type!: ... or a "BREAKING CHANGE:" footer -> major     feat -> minor     fix, perf -> patch
#   docs, chore, ci, test, style, refactor, build, ... -> no numbered release
#
# See packaging/ci/next-version.sh for the exact rules. Pushing a v* tag by hand still publishes that tag.
# A manual run (Actions tab) only builds; the files are kept as workflow artifacts.
on:
  push:
    branches: [main]
    # Path filters are not applied to tag pushes, so a tag always builds.
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
      - ".gitattributes"
    tags: ["v*"]
  workflow_dispatch:

# A newer push to the same ref replaces a build that is still running. Nothing is lost: the next run looks at
# every commit since the last release, not just the latest push.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Work out the version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.v.outputs.release }}
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      bump: ${{ steps.v.outputs.bump }}
      previous: ${{ steps.v.outputs.previous }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the whole history and all tags, so commits since the last release can be read

      - name: Pick the version
        id: v
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            # A tag pushed by hand is released exactly as named.
            {
              echo "release=true"
              echo "version=${GITHUB_REF_NAME#v}"
              echo "tag=$GITHUB_REF_NAME"
              echo "bump=manual"
              echo "previous=none"
            } >> "$GITHUB_OUTPUT"
          else
            bash packaging/ci/next-version.sh | tee -a "$GITHUB_OUTPUT"
          fi

      - name: Summary
        shell: bash
        env:
          RELEASE: ${{ steps.v.outputs.release }}
          VERSION: ${{ steps.v.outputs.version }}
          BUMP: ${{ steps.v.outputs.bump }}
          PREVIOUS: ${{ steps.v.outputs.previous }}
        run: |
          {
            echo "### Version"
            echo "- previous release: \`$PREVIOUS\`"
            echo "- bump: **$BUMP**"
            echo "- building as: \`$VERSION\`"
            if [[ "$RELEASE" == "true" ]]; then echo "- a numbered release **will** be published"; else echo "- no numbered release (no feat, fix or perf commits since the last one)"; fi
          } >> "$GITHUB_STEP_SUMMARY"

  windows:
    name: Windows x64
    needs: version
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set the version for this build
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: bash packaging/ci/set-version.sh "$VERSION"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $name = "LLM-Switch-$version-windows-x64"
          $stage = "dist/stage/$name"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item target/release/llm-switch.exe, target/release/llm-switch-cli.exe, LICENSE, README.md $stage
          Compress-Archive -Path $stage -DestinationPath "dist/$name.zip"
          Get-ChildItem dist/*.zip | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: dist/*.zip
          if-no-files-found: error

  macos:
    name: macOS universal
    needs: version
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set the version for this build
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: bash packaging/ci/set-version.sh "$VERSION"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build and bundle the app
        run: ./packaging/macos/bundle.sh --universal

      - uses: actions/upload-artifact@v4
        with:
          name: macos-zip
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish
    # Only after BOTH builds succeed, and never for manual test runs.
    needs: [version, windows, macos]
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE: ${{ needs.version.outputs.release }}
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      BUMP: ${{ needs.version.outputs.bump }}
      PREVIOUS: ${{ needs.version.outputs.previous }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          ls -l dist

          # 1. A numbered release, when the commits call for one (or a tag was pushed by hand).
          if [[ "$RELEASE" == "true" ]]; then
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" dist/*.zip --clobber
            else
              args=(--title "LLM Switch $TAG" --generate-notes)
              if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
                args+=(--verify-tag)
              else
                args+=(--target "$GITHUB_SHA") # creates the tag on this commit
              fi
              gh release create "$TAG" dist/*.zip "${args[@]}"
            fi
          fi

          # 2. The rolling pre-release for main, recreated so it only ever holds the newest files.
          if [[ "$GITHUB_REF_TYPE" == "branch" ]]; then
            SHORT="${GITHUB_SHA::7}"
            if [[ "$RELEASE" == "true" ]]; then
              STATUS="This commit published the numbered release **$TAG**."
            else
              STATUS="No numbered release: there are no \`feat\`, \`fix\` or \`perf\` commits since \`$PREVIOUS\`."
            fi
            cat > notes.md <<EOF
          Automated build of \`main\` at commit [\`$SHORT\`](https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA),
          built as version \`$VERSION\`. $STATUS

          This release is replaced on every push to \`main\`. For a stable version, use a numbered release.

          | File | For |
          |---|---|
          | \`LLM-Switch-$VERSION-windows-x64.zip\` | Windows 10/11, 64-bit. Unzip and run \`llm-switch.exe\`. |
          | \`LLM-Switch-$VERSION-macos.zip\` | macOS 11+, Apple Silicon and Intel. Ad-hoc signed: right-click the app and choose Open the first time. |

          Build log: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF
            gh release delete latest --yes --cleanup-tag 2>/dev/null || true
            gh release create latest dist/*.zip \
              --prerelease --target "$GITHUB_SHA" \
              --title "Latest build (main @ $SHORT)" --notes-file notes.md
          fi
