[package]
name = "llm-switch"
version = "0.1.0"
edition = "2024"
description = "Start, stop and auto-tune local llama.cpp models, with OpenCode sync"
license = "MIT"
readme = "README.md"
repository = "https://github.com/MokshVerma/llm-switch"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# Linux has no built-in windowing backend in winit; Windows and macOS do.
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

[dependencies]
anyhow = "1.0.104"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow"] }
flate2 = "1.1.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
sysinfo = { version = "0.40.1", default-features = false, features = ["disk", "system"] }
tar = "0.4.46"
toml = "1.2.1"
ureq = "3.5.1"
zip = { version = "9.4.1", default-features = false, features = ["deflate"] }

[build-dependencies]
embed-resource = "3.0.12"
